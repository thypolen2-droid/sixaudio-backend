<!DOCTYPE html>
<html>

<head>
    <title>Close Button Test</title>
    <style>
        .player-view {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a2e;
            transform: translateY(100%);
            transition: transform 0.3s;
            z-index: 300;
        }

        .player-view.active {
            transform: translateY(0);
        }

        .player-close {
            position: absolute;
            top: 20px;
            right: 24px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .test-btn {
            margin: 20px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <button class="test-btn" onclick="openPlayer()">Open Player</button>

    <div class="player-view" id="playerView">
        <button class="player-close" id="playerClose">×</button>
        <div style="color: white; padding: 100px; font-size: 24px;">
            Player View - Click X to close
        </div>
    </div>

    <script>
        const playerView = document.getElementById('playerView');
        const playerClose = document.getElementById('playerClose');

        function openPlayer() {
            console.log('Opening player');
            playerView.classList.add('active');
        }

        if (playerClose) {
            console.log('✅ Player close button found');
            playerClose.addEventListener('click', (e) => {
                console.log('❌ Close button clicked!');
                e.preventDefault();
                e.stopPropagation();
                playerView.classList.remove('active');
            });
        } else {
            console.error('❌ Player close button NOT found!');
        }
    </script>
</body>

</html>
